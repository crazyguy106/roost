{% extends "base.html" %}
{% block title %}Terminal — Roost{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  #tty-host { height: calc(100vh - 180px); min-height: 360px; padding: 8px; background:#000; border-radius: 6px; }
  #tty-host .xterm { height: 100%; }
  #tty-status { font-family: monospace; }
  #tty-tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .tty-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 6px 6px 0 0;
    background: var(--fallback-b3, #1f242b); color: inherit;
    border: 1px solid transparent; border-bottom: none;
    cursor: pointer; font-size: 13px; max-width: 220px;
  }
  .tty-tab .tty-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tty-tab.active { background: #000; border-color: var(--fallback-b3, #2a313a); }
  .tty-tab:hover { background: var(--fallback-b2, #242a32); }
  .tty-tab.active:hover { background: #000; }
  .tty-tab .tty-close {
    opacity: 0.4; padding: 0 4px; border-radius: 4px; line-height: 1;
  }
  .tty-tab:hover .tty-close { opacity: 1; }
  .tty-tab .tty-close:hover { background: rgba(255,80,80,0.2); color: #ff7070; }
  #tty-new {
    padding: 4px 10px; border-radius: 6px;
    background: transparent; border: 1px dashed rgba(255,255,255,0.2);
    cursor: pointer; font-size: 13px; color: inherit;
  }
  #tty-new:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.4); }
</style>

<div class="flex items-center justify-between mb-3">
  <div>
    <h1 class="text-xl font-bold">Terminal</h1>
    <p class="text-sm opacity-60">
      Persistent tmux windows. Close the tab to detach; reopen to resume.
    </p>
  </div>
  <div id="tty-status" class="text-sm opacity-70">connecting…</div>
</div>

<div id="tty-tabs">
  <!-- tabs injected by JS -->
  <button id="tty-new" type="button" title="Open a new terminal window">+ New</button>
</div>

<div id="tty-host"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
(function () {
  const host = document.getElementById('tty-host');
  const status = document.getElementById('tty-status');
  const tabsEl = document.getElementById('tty-tabs');
  const newBtn = document.getElementById('tty-new');

  const term = new window.Terminal({
    cursorBlink: true,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
    fontSize: 14,
    theme: { background: '#000000' },
    scrollback: 5000,
  });
  const fit = new window.FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);
  try { fit.fit(); } catch (e) {}

  // ── State ──────────────────────────────────────────────────────────
  let windows = [];          // [{id, tmux_window_name, title, ...}]
  let activeName = null;     // currently-attached tmux_window_name
  let ws = null;             // current WebSocket
  let suppressReconnectBanner = false;

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(new TextEncoder().encode(data));
    }
  });

  // ── Rendering ──────────────────────────────────────────────────────
  function renderTabs() {
    // Wipe existing tab elements but keep the "+ New" button.
    [...tabsEl.querySelectorAll('.tty-tab')].forEach((n) => n.remove());

    for (const w of windows) {
      const tab = document.createElement('div');
      tab.className = 'tty-tab' + (w.tmux_window_name === activeName ? ' active' : '');
      tab.dataset.name = w.tmux_window_name;
      tab.dataset.id = w.id;
      tab.title = w.title;

      const title = document.createElement('span');
      title.className = 'tty-title';
      title.textContent = w.title;

      const close = document.createElement('span');
      close.className = 'tty-close';
      close.textContent = '×';
      close.title = 'Close conversation';
      close.addEventListener('click', (ev) => {
        ev.stopPropagation();
        onCloseWindow(w);
      });

      tab.appendChild(title);
      tab.appendChild(close);
      tab.addEventListener('click', () => switchTo(w.tmux_window_name));
      tabsEl.insertBefore(tab, newBtn);
    }
  }

  // ── API helpers ────────────────────────────────────────────────────
  async function apiListWindows() {
    const res = await fetch('/api/tty/windows', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('list failed: ' + res.status);
    const body = await res.json();
    return body.windows || [];
  }

  async function apiCreateWindow(title) {
    const res = await fetch('/api/tty/windows', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title || '' }),
    });
    if (!res.ok) throw new Error('create failed: ' + res.status);
    return await res.json();
  }

  async function apiDeleteWindow(id) {
    const res = await fetch('/api/tty/windows/' + id, {
      method: 'DELETE',
      credentials: 'same-origin',
    });
    if (!res.ok) throw new Error('delete failed: ' + res.status);
  }

  // ── WebSocket connection ───────────────────────────────────────────
  function connect(windowName) {
    suppressReconnectBanner = ws !== null;
    if (ws) {
      try { ws.close(); } catch (e) {}
      ws = null;
    }
    term.clear();
    status.textContent = 'connecting…';

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/ws/tty'
      + (windowName ? '?window=' + encodeURIComponent(windowName) : '');
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.addEventListener('open', () => {
      status.textContent = 'connected — ' + (windowName || 'main');
      sendResize();
    });
    ws.addEventListener('close', (ev) => {
      if (suppressReconnectBanner) return;
      if (ev.code === 1008) {
        status.textContent = 'unauthorized — please log in again';
      } else {
        status.textContent = 'disconnected';
        term.writeln('\r\n\x1b[33m[connection closed]\x1b[0m');
      }
    });
    ws.addEventListener('error', () => { status.textContent = 'error'; });
    ws.addEventListener('message', (ev) => {
      if (ev.data instanceof ArrayBuffer) {
        term.write(new Uint8Array(ev.data));
      }
    });
  }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    try {
      ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
    } catch (e) {}
  }

  // ── Actions ────────────────────────────────────────────────────────
  async function switchTo(windowName) {
    if (windowName === activeName) return;
    activeName = windowName;
    renderTabs();
    connect(windowName);
  }

  async function onNewWindow() {
    try {
      const created = await apiCreateWindow('');
      windows.unshift(created);
      activeName = created.tmux_window_name;
      renderTabs();
      connect(activeName);
    } catch (e) {
      status.textContent = 'failed to create window';
    }
  }

  async function onCloseWindow(w) {
    const ok = window.confirm(
      'Close "' + w.title + '"?\n\nThe terminal session for this conversation will be killed. '
      + 'Anything running inside is lost.'
    );
    if (!ok) return;
    try {
      await apiDeleteWindow(w.id);
      windows = windows.filter((x) => x.id !== w.id);
      if (w.tmux_window_name === activeName) {
        activeName = windows[0] ? windows[0].tmux_window_name : null;
        renderTabs();
        if (activeName) connect(activeName);
        else { term.clear(); status.textContent = 'no windows — click + New'; }
      } else {
        renderTabs();
      }
    } catch (e) {
      status.textContent = 'failed to close window';
    }
  }

  newBtn.addEventListener('click', onNewWindow);

  const resizeObserver = new ResizeObserver(() => {
    try { fit.fit(); } catch (e) {}
    sendResize();
  });
  resizeObserver.observe(host);
  window.addEventListener('beforeunload', () => {
    try { ws && ws.close(); } catch (e) {}
  });

  // ── Boot ───────────────────────────────────────────────────────────
  (async function boot() {
    try {
      windows = await apiListWindows();
    } catch (e) {
      windows = [];
    }
    if (windows.length === 0) {
      try {
        const created = await apiCreateWindow('main');
        windows = [created];
      } catch (e) {
        status.textContent = 'failed to open initial window';
        return;
      }
    }
    activeName = windows[0].tmux_window_name;
    renderTabs();
    connect(activeName);
  })();
})();
</script>
{% endblock %}
