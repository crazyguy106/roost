<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set Password — VPSTools</title>
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link href="/static/vendor/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="/static/vendor/daisyui-themes.css" rel="stylesheet" type="text/css" />
    <script src="/static/vendor/tailwind-browser.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: oklch(0.2 0.015 250);
        }
    </style>
</head>
<body>
    <div class="card bg-base-200 shadow-xl w-full max-w-sm mx-4">
        <div class="card-body items-center text-center">
            <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-white mb-2"
                 style="background: oklch(0.65 0.2 260);">V</div>
            <h1 class="text-2xl font-bold mb-1">VPSTools</h1>
            <p class="opacity-60 mb-4">Set your login password</p>

            {% if success %}
            <div class="alert alert-success w-full mb-4">
                <span>Password set successfully.</span>
            </div>
            <a href="/auth/login-page" class="btn btn-primary w-full">Sign In</a>
            {% else %}

            {% if error %}
            <div class="alert alert-error w-full mb-4">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/auth/setup" class="w-full space-y-4">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="form-control w-full">
                    <label class="label"><span class="label-text">New Password</span></label>
                    <input type="password" name="password" class="input input-bordered w-full"
                           placeholder="Choose a strong password" required minlength="8" autofocus>
                </div>
                <div class="form-control w-full">
                    <label class="label"><span class="label-text">Confirm Password</span></label>
                    <input type="password" name="password_confirm" class="input input-bordered w-full"
                           placeholder="Type it again" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-full">Set Password</button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
