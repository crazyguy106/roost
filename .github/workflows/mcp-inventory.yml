name: mcp-inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow regenerates docs/mcp-inventory.md from the source
# @mcp.tool() decorators and fails if the committed file has drifted.
# When this fails on a PR, run `python scripts/gen_mcp_inventory.py`
# locally and commit the diff.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate inventory
        run: python scripts/gen_mcp_inventory.py

      - name: Fail on drift
        run: |
          if ! git diff --exit-code docs/mcp-inventory.md; then
            echo ""
            echo "::error::docs/mcp-inventory.md is stale."
            echo "::error::Run: python scripts/gen_mcp_inventory.py"
            echo "::error::Then commit the diff."
            exit 1
          fi
