# ─────────────────────────────────────────────────────────────────────
# This file is tracked on purpose — it's the SSH-into-Claude shortcut.
# Compose convention is that overrides are per-machine and gitignored;
# Roost checks this one in because the AUDIT_WRITE cap + bind-mounts
# below are needed for the sshd-in-container workflow to survive a
# recreate. See docs/container-ssh-access.md and CLAUDE.md §
# "SSH-into-Claude shortcut" for the why.
# ─────────────────────────────────────────────────────────────────────
services:
  roost:
    ports: !override
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:2222:22"
    cap_add:
      - AUDIT_WRITE
    volumes:
      - ./ssh/authorized_keys:/home/dev/.ssh/authorized_keys:ro
      - ./ssh/sshd_config.d:/etc/ssh/sshd_config.d:ro
      - ./ssh/bash_profile:/home/dev/.bash_profile:ro
