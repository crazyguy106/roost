# ANNOTATED QUESTION PACK EXAMPLE
# ──────────────────────────────────────────────────────────────────────
# A "question pack" is the 3-5 qualifying questions Roost asks a new
# lead over the inbound channel (WhatsApp / WeChat / Telegram) right
# after they enrol in a cadence. Answers are scored against keywords
# to label the lead hot / warm / cold, which decides routing:
#
#   hot   → operator alerted on Telegram + cadence resumes
#   warm  → cadence resumes silently
#   cold  → enrolment exits, no further follow-up
#
# A pack is bound to a cadence by `cadence_slug`. When a lead enrols in
# that cadence on an addressable channel (whatsapp / wechat / telegram),
# Roost looks up the pack, sends question 1, and pauses the cadence
# until every answer is in.
#
# To activate a pack:
#   1. Copy this file to roost-config/question-packs/<name>.yaml
#   2. Edit the questions, keywords, weights for your audience
#   3. Reload (hot-reload watches this directory)
#
# Pedagogical tips:
#   - Keep questions short. WhatsApp users reply in fragments.
#   - One question per turn. Bundled questions ("budget AND timeline?")
#     get bundled answers that are hard to keyword-match.
#   - Weights need not sum to 1.0 — they're normalised at scoring time.
#   - hot_keywords / warm_keywords are case-insensitive substring matches.
#     No NLP — pick distinctive tokens.
#   - Test against real replies, not idealised ones. People type "yup",
#     "ya", "sure", "ok" — include them.
# ──────────────────────────────────────────────────────────────────────

cadence_slug: financial_advisor_intro  # which cadence triggers this pack
enabled: true

questions:
  - key: timeline                      # short slug; stored in fields_json under this name
    question: |                        # text sent to the lead verbatim
      Thanks for reaching out! Quick question to help me understand
      what you're looking for — when are you thinking of getting your
      finances reviewed? (e.g. 'this month', 'in a few months', 'no rush')
    weight: 0.4                        # contribution to overall score
    hot_keywords:                      # any of these in the answer → +weight * 1.0
      - this week
      - this month
      - asap
      - immediately
      - urgent
      - right now
      - next week
    warm_keywords:                     # any of these → +weight * 0.5
      - next month
      - 2 months
      - 3 months
      - soon
      - this year
      - in a few months

  - key: trigger
    question: |
      What prompted you to reach out? (e.g. new job, new baby, marriage,
      retirement planning, insurance review, something else)
    weight: 0.3
    hot_keywords:
      - new baby
      - just married
      - retiring
      - retirement
      - new job
      - bought a house
      - inheritance
      - bonus
    warm_keywords:
      - thinking about
      - reviewing
      - curious
      - planning

  - key: existing_coverage
    question: |
      Do you already have insurance / investments in place, or starting
      fresh? (e.g. 'have some life insurance', 'CPF only', 'starting fresh')
    weight: 0.3
    hot_keywords:
      - nothing
      - starting fresh
      - no insurance
      - just cpf
      - cpf only
      - none
    warm_keywords:
      - have some
      - basic
      - employer
      - group insurance
      - reviewing existing

# Scoring rule (read-only — defined in roost/extras/lead_nurture/services/qualification.py):
#   raw = Σ (weight × match_value) where match_value = 1.0 (hot) / 0.5 (warm) / 0 (none)
#   score = raw / Σ weights
#   score >= 0.7 → hot
#   score >= 0.4 → warm
#   else         → cold
#
# So with the weights above, a single hot match on `trigger` (0.3 / 1.0 = 0.3)
# alone is not enough to hit hot — you need at least one more matching answer.
# Tune weights to match the strongest signal in your audience.
