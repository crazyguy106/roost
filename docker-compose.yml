services:
  roost:
    build:
      context: .
      args:
        ENABLE_GOOGLE: "false"
        ENABLE_MICROSOFT: "false"
        ENABLE_AI: "true"
        ENABLE_TELEGRAM: "false"
        ENABLE_NOTION: "false"
        ENABLE_INFRA: "false"
        ENABLE_DISCORD: "false"
        ENABLE_SLACK: "false"
        ENABLE_MATRIX: "false"
    ports:
      - "8080:8080"
      - "2222:22"
    volumes:
      # Host bind-mount: ./data holds roost.db + RPA flow state + browser_state.
      # Bind-mount (not named volume) so `docker compose down -v` cannot wipe
      # it by accident, and so `scripts/roost-update.sh` can tar it directly
      # without a helper container. Container runs as root; bind dir is owned
      # by the host user that ran `docker compose up`.
      - ./data:/app/data
      - roost-config:/app/config
      # Bind-mount .env so the setup wizard's writes (WEB_PASSWORD,
      # ROOST_DOMAIN, SIDECAR_PUBLIC_URL) land back on the host file
      # that compose reads via env_file. Without this, wizard changes
      # are stranded in the container's writable layer and lost on rebuild.
      - ./.env:/app/.env
      # Persist per-vendor CLI auth state for AGENT_PROVIDER=<vendor>_cli.
      # HOST_*_DIR defaults to ./<vendor>-auth so first-boot `<vendor> login`
      # state survives `docker compose down/up` and image rebuilds. Each
      # subprocess agent (Claude Code / Gemini CLI / Codex) reads its own dir.
      - ${HOST_CLAUDE_DIR:-./claude-auth}:/home/dev/.claude
      - ${HOST_GEMINI_DIR:-./gemini-auth}:/home/dev/.gemini
      - ${HOST_CODEX_DIR:-./codex-auth}:/home/dev/.codex
    env_file:
      - .env
    environment:
      # Container runs as root, but the per-vendor CLI auth volumes mount
      # to /home/dev/.{claude,gemini,codex} (chowned to dev:dev in the
      # Dockerfile). Point HOME at /home/dev so `claude` / `gemini` / `codex`
      # read and write their state in the bind-mounted dirs and survive
      # restarts. Without this, subscription auth lands in /root and is
      # lost on the next `docker compose up`.
      HOME: "/home/dev"
    restart: unless-stopped
    depends_on:
      chromium:
        condition: service_started
    # Kernel-level hardening
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # sshd: file ownership
      - SETUID       # gosu + sshd: privilege drop
      - SETGID       # gosu + sshd: privilege drop
      - NET_BIND_SERVICE  # sshd: bind port 22
      - SYS_CHROOT   # sshd: chroot
      - DAC_OVERRIDE  # sshd: read host keys
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Headless Chromium for scrape_js and Playwright MCP
  chromium:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    # Loopback-only publish so the user can open the live debug URL when
    # an `await_user_session` step pauses (Singpass logins etc.). Safe by
    # default for laptop deployments. For cloud deployments either:
    #   (a) remove this `ports:` block and tunnel via SSH (`-L 3000:chromium:3000`)
    #   (b) front it with your own reverse proxy + auth, then set
    #       SIDECAR_PUBLIC_URL=https://your.domain in .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Run without sandbox (container provides isolation)
      CONNECTION_TIMEOUT: "600000"
      MAX_CONCURRENT_SESSIONS: "5"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN    # Chromium sandbox within container
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  roost-config:
