services:
  roost:
    build:
      context: .
      args:
        ENABLE_GOOGLE: "false"
        ENABLE_MICROSOFT: "false"
        ENABLE_AI: "true"
        ENABLE_TELEGRAM: "false"
        ENABLE_NOTION: "false"
        ENABLE_INFRA: "false"
    ports:
      - "8080:8080"
      - "2222:22"
    volumes:
      - roost-data:/app/data
      - roost-config:/app/config
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      chromium:
        condition: service_started
    # Kernel-level hardening
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # sshd: file ownership
      - SETUID       # gosu + sshd: privilege drop
      - SETGID       # gosu + sshd: privilege drop
      - NET_BIND_SERVICE  # sshd: bind port 22
      - SYS_CHROOT   # sshd: chroot
      - DAC_OVERRIDE  # sshd: read host keys
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Headless Chromium for scrape_js and Playwright MCP
  chromium:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      # Run without sandbox (container provides isolation)
      CONNECTION_TIMEOUT: "600000"
      MAX_CONCURRENT_SESSIONS: "5"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN    # Chromium sandbox within container
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  roost-data:
  roost-config:
